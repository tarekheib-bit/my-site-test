<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#e8f4f8"/>

  <!-- Gradient shape -->
  <circle cx="100" cy="100" r="80" fill="url(#grad1)"/>

  <!-- Decorative shapes -->
  <rect x="250" y="80" width="100" height="100" fill="#ff6b6b" rx="10"/>
  <circle cx="200" cy="200" r="50" fill="#4ecdc4"/>

  <!-- Text -->
  <text x="200" y="280" font-size="24" text-anchor="middle" fill="#333" font-weight="bold">
    Your Image Here
  </text>
</svg>